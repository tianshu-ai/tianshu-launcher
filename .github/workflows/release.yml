name: Release

# Triggered by pushing a tag like v0.1.0. Builds the launcher on
# macOS / Linux / Windows runners, uploads each platform's bundle as
# a workflow artifact, and creates a GitHub Release with those bundles
# attached. No code signing is wired here yet — DMG/MSI/NSIS output
# will be unsigned, which is fine for the early access release and
# matches what tianshu-ai/bridge-desktop ships today.
#
# To cut a release:
#   git tag v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
#
# The workflow uses tauri-apps/tauri-action which handles tauri build,
# creates the Release in draft mode, uploads the matching artifact per
# platform, and promotes to published once all three jobs succeed.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Leave empty for continuous.'
        required: false
        type: string

permissions:
  contents: write

# Determine the effective tag: explicit tag push / workflow_dispatch input / 'continuous' for main push.
# The 'continuous' release is a rolling pre-release that always points to the latest main build.

jobs:
  # Create the draft release first so all platform jobs can upload to it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is_continuous: ${{ steps.resolve.outputs.is_continuous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="continuous"
          fi
          IS_CONTINUOUS="false"
          if [ "$TAG" = "continuous" ]; then
            IS_CONTINUOUS="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_continuous=$IS_CONTINUOUS" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (continuous=$IS_CONTINUOUS)"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          IS_CONTINUOUS="${{ steps.resolve.outputs.is_continuous }}"

          if [ "$IS_CONTINUOUS" = "true" ]; then
            # Delete existing continuous release assets so we start fresh
            if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
              echo "Cleaning existing continuous release..."
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            fi
            # Force-move the tag to HEAD
            git tag -f "$TAG"
            git push origin "$TAG" --force 2>/dev/null || true
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Tianshu Launcher (continuous)" \
              --prerelease \
              --notes "Rolling build from \`main\` branch ($(date -u +%Y-%m-%d %H:%M UTC)).\n\nThis release is automatically replaced on every push to main.\n\n⚠️ **Not a stable release** — use for testing only."
            echo "Created continuous release"
          else
            if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
              echo "Release $TAG already exists, skipping creation"
            else
              gh release create "$TAG" \
                --repo "${{ github.repository }}" \
                --title "Tianshu Launcher $TAG" \
                --draft \
                --notes "Building..."
              echo "Created draft release $TAG"
            fi
          fi

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.is_continuous == 'true' && github.sha || needs.create-release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: release-${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm deps
        run: npm install

      - name: Cache payload (server + bridge + Node sidecar)
        uses: actions/cache@v4
        id: payload-cache
        with:
          path: |
            src-tauri/resources
            src-tauri/binaries
          key: payload-${{ matrix.target }}-${{ hashFiles('scripts/prepare-payload.mjs') }}
          restore-keys: |
            payload-${{ matrix.target }}-

      - name: Prepare payload
        if: steps.payload-cache.outputs.cache-hit != 'true'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: npm run payload

      # ── macOS: ad-hoc code signing ──
      # Tauri recognises APPLE_SIGNING_IDENTITY="-" as ad-hoc.
      # No Apple Developer account needed; users will see "Open Anyway"
      # in System Settings instead of "app is damaged".

      # ── Windows: self-signed certificate ──
      # Generate a throwaway self-signed code-signing cert in CI,
      # import it into the cert store, and tell Tauri to use it.
      # This shows "Tianshu AI" as publisher instead of "Unknown".
      - name: Create Windows self-signed certificate
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Tianshu AI, O=Tianshu AI" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(10)
          $thumbprint = $cert.Thumbprint
          echo "WINDOWS_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          echo "Certificate created with thumbprint: $thumbprint"

          # Write a Tauri config overlay that sets the thumbprint
          $configOverlay = @"
          {
            "bundle": {
              "windows": {
                "certificateThumbprint": "$thumbprint",
                "digestAlgorithm": "sha256",
                "timestampUrl": "http://timestamp.digicert.com"
              }
            }
          }
          "@
          Set-Content -Path "$env:GITHUB_WORKSPACE\signing-override.json" -Value $configOverlay
          echo "Signing config overlay written"

      - name: Build + create/upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: ${{ needs.create-release.outputs.is_continuous == 'true' && 'Tianshu Launcher (continuous)' || format('Tianshu Launcher {0}', needs.create-release.outputs.tag) }}
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File | Notes |
            |----------|------|-------|
            | **macOS** (Apple Silicon) | `.dmg` | See note below ↓ |
            | **Windows** | `.exe` (NSIS) or `.msi` | SmartScreen warning — click "More info → Run anyway" |
            | **Linux** | `.deb` | No issues |

            ### ⚠️ macOS first launch

            The app is ad-hoc signed (not notarized by Apple). On first launch:
            1. macOS will show a warning
            2. Go to **System Settings → Privacy & Security** → scroll down → click **Open Anyway**

            Or run once in Terminal:
            ```bash
            /usr/bin/xattr -cr /Applications/Tianshu.app
            ```

            ---

            Includes:
            - Tianshu server (bundled Node runtime, no system Node/npm required)
            - Local Bridge + browser engine (@playwright/mcp)
            - System tray with server/bridge controls
            - In-app updates (Check for Updates in the UI)
          releaseDraft: ${{ needs.create-release.outputs.is_continuous != 'true' }}
          prerelease: ${{ needs.create-release.outputs.is_continuous == 'true' || contains(needs.create-release.outputs.tag, '-') }}
          args: >-
            --target ${{ matrix.target }}
            ${{ matrix.os == 'windows-2022' && '--config signing-override.json' || '' }}

      # ── macOS: re-sign node sidecar with entitlements ──
      # Tauri's ad-hoc signing adds Hardened Runtime to all binaries
      # but without entitlements. Node.js needs JIT (V8) and network
      # access entitlements, otherwise macOS kills it with SIGTRAP.
      # Re-sign the node binary inside the built .app with entitlements,
      # then re-package the .app.tar.gz and re-sign the Tauri updater sig.
      - name: Re-sign node sidecar with entitlements (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -eo pipefail
          TARGET="${{ matrix.target }}"
          APP_DIR="src-tauri/target/${TARGET}/release/bundle/macos/Tianshu.app"
          NODE_BIN="${APP_DIR}/Contents/MacOS/node"

          if [ ! -f "$NODE_BIN" ]; then
            echo "::warning::node binary not found at $NODE_BIN, trying with triple suffix"
            NODE_BIN=$(find "${APP_DIR}/Contents/MacOS" -name 'node*' -not -name 'tianshu*' | head -1)
          fi

          if [ -n "$NODE_BIN" ] && [ -f "$NODE_BIN" ]; then
            echo "Re-signing $NODE_BIN with entitlements..."
            codesign --force --sign - \
              --entitlements src-tauri/node.entitlements.plist \
              "$NODE_BIN"
            echo "Verifying:"
            codesign -dvv "$NODE_BIN" 2>&1 | grep -E 'flags|Signature|Entitlements' || true

            # Re-sign the app bundle (outer signature must be refreshed
            # after modifying an inner binary)
            codesign --force --sign - --deep "$APP_DIR"
            echo "App bundle re-signed"

            # Re-create the .app.tar.gz that the updater uses
            TAR_GZ=$(find "src-tauri/target/${TARGET}/release/bundle/macos" -name '*.app.tar.gz' | head -1)
            if [ -n "$TAR_GZ" ]; then
              APP_NAME=$(basename "$APP_DIR")
              BUNDLE_DIR=$(dirname "$TAR_GZ")
              tar -czf "$TAR_GZ" -C "$(dirname "$APP_DIR")" "$APP_NAME"
              echo "Re-packaged $TAR_GZ"

              # Re-generate the .sig file for the Tauri updater
              if command -v tauri &>/dev/null; then
                tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" "$TAR_GZ"
                echo "Re-signed updater signature"
              elif [ -f "${TAR_GZ}.sig" ]; then
                # tauri CLI may not be in PATH; try npx
                npx @tauri-apps/cli signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" "$TAR_GZ" || \
                  echo "::warning::Could not re-sign updater .sig — updater may reject this build"
              fi
            fi

            # Also re-create the .dmg
            DMG=$(find "src-tauri/target/${TARGET}/release/bundle/dmg" -name '*.dmg' | head -1)
            if [ -n "$DMG" ]; then
              echo "Re-creating DMG..."
              hdiutil create -volname "Tianshu" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG"
              echo "DMG re-created: $DMG"
            fi

            # Re-upload the re-signed artifacts to the GitHub Release,
            # overwriting the ones tauri-action already uploaded.
            TAG="${{ needs.create-release.outputs.tag }}"
            echo "Uploading re-signed artifacts to release $TAG..."
            if [ -n "$DMG" ] && [ -f "$DMG" ]; then
              gh release upload "$TAG" "$DMG" --repo "${{ github.repository }}" --clobber
              echo "Uploaded DMG"
            fi
            if [ -n "$TAR_GZ" ] && [ -f "$TAR_GZ" ]; then
              gh release upload "$TAG" "$TAR_GZ" --repo "${{ github.repository }}" --clobber
              echo "Uploaded .app.tar.gz"
              if [ -f "${TAR_GZ}.sig" ]; then
                gh release upload "$TAG" "${TAR_GZ}.sig" --repo "${{ github.repository }}" --clobber
                echo "Uploaded .app.tar.gz.sig"
              fi
            fi
          else
            echo "::warning::node sidecar not found in app bundle"
          fi

      - name: Upload artifact (always, even without a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianshu-launcher-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: ignore

  # Generate latest.json for the Tauri updater after all platforms finish.
  updater-json:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.is_continuous == 'true' && github.sha || needs.create-release.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -eo pipefail
          REPO="tianshu-ai/tianshu-launcher"
          VERSION="${TAG#v}"

          # Read signatures from the .sig files uploaded by tauri-action
          read_sig() {
            local pattern="$1"
            local f=$(find artifacts -name "$pattern" 2>/dev/null | head -1)
            if [ -n "$f" ]; then cat "$f"; else echo ""; fi
          }

          MAC_SIG=$(read_sig '*.app.tar.gz.sig')
          WIN_NSIS_SIG=$(read_sig '*-setup.exe.sig')

          # Find actual filenames from the GitHub Release
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          MAC_FILE=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep '.app.tar.gz$' | head -1)
          WIN_NSIS_FILE=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep 'setup.exe$' | head -1)

          # Validate we have what we need
          if [ -z "$MAC_SIG" ] || [ -z "$MAC_FILE" ]; then
            echo "::warning::macOS signature or file not found"
          fi
          if [ -z "$WIN_NSIS_SIG" ] || [ -z "$WIN_NSIS_FILE" ]; then
            echo "::warning::Windows signature or file not found"
          fi

          # Compose latest.json (macOS + Windows; Linux updater not yet supported)
          cat > latest.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE}/${MAC_FILE}"
              },
              "windows-x86_64": {
                "signature": "${WIN_NSIS_SIG}",
                "url": "${BASE}/${WIN_NSIS_FILE}"
              }
            }
          }
          ENDJSON

          echo "--- latest.json ---"
          cat latest.json

      - name: Upload latest.json to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$TAG" latest.json --repo tianshu-ai/tianshu-launcher --clobber
