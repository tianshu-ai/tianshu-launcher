# Dependabot — automated dependency PRs for tianshu-launcher.
# Covers: npm (frontend + Tauri JS bindings), Cargo (Tauri Rust), GitHub Actions.

version: 2
updates:
  # ── npm: root ─────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - chore
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - "typescript"
          - "vite*"
          - "@vitejs/*"
        update-types:
          - minor
          - patch

  # ── Cargo: Tauri Rust ─────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - chore
      - dependencies
      - area/rust
    commit-message:
      prefix: "chore(deps,rust)"
      include: scope
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - minor
          - patch

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - chore
      - dependencies
      - area/ci
    commit-message:
      prefix: "chore(deps,ci)"
      include: scope
