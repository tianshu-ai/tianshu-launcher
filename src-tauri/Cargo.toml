[package]
name = "tianshu-launcher"
version = "0.1.0-4"
description = "Tianshu Launcher desktop app"
authors = ["tianshu-ai"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Narrow feature list: we only need Job Objects + taskkill fallback,
# so pick exactly the Win32 modules we touch and keep the compile
# fast. If more Windows APIs show up later, add them explicitly
# instead of enabling umbrella features.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[[bin]]
name = "tianshu-launcher"
path = "src/main.rs"
