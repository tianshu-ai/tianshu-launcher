<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianshu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1a;
      --surface: #131a27;
      --accent: #c9a96e;
      --fg: #e8e8e8;
      --fg-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.5;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: var(--accent);
    }
    .tagline {
      color: var(--fg-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card-title {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .dot.on { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }
    .card-sub {
      color: var(--fg-muted);
      font-size: 12px;
      margin-top: 2px;
    }
    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: rgba(255, 255, 255, 0.04); }
    button.primary {
      background: var(--accent);
      color: #0a0f1a;
      border-color: var(--accent);
      font-weight: 500;
    }
    button.primary:hover { background: #d4b57e; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .open-ui-row {
      margin-top: 20px;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>⭐ Tianshu</h1>
  <div class="tagline">AI agent runtime — self-contained desktop launcher</div>

  <div class="card">
    <div class="card-info">
      <div class="card-title">
        <span class="dot" id="server-dot"></span>
        Server
      </div>
      <div class="card-sub" id="server-sub">Stopped</div>
    </div>
    <button id="server-btn" class="primary">Start</button>
  </div>

  <div class="card">
    <div class="card-info">
      <div class="card-title">
        <span class="dot" id="bridge-dot"></span>
        Local Bridge
      </div>
      <div class="card-sub">Optional — browser/shell for Windows or isolated environments</div>
    </div>
    <button id="bridge-btn">Start</button>
  </div>

  <div class="open-ui-row">
    <button id="open-ui-btn" class="primary" disabled>Open Tianshu →</button>
  </div>

  <div class="footer">
    Config writes to <code id="home-path">~/.tianshu/</code>
  </div>

  <script src="main.js"></script>
</body>
</html>
