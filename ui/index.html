<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianshu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1a;
      --surface: #131a27;
      --surface-2: #1a2232;
      --accent: #c9a96e;
      --fg: #e8e8e8;
      --fg-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 2px 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: block;
    }
    .tagline {
      color: var(--fg-muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--fg-muted);
      border-bottom: 2px solid transparent;
      font-size: 13px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: 1px;
    }
    .tab.active .tab-badge { background: rgba(201, 169, 110, 0.2); color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .server-card { padding: 14px 14px; }
    .card-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .card-title {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .dot.on { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }
    .dot.starting {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .card-sub {
      color: var(--fg-muted);
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Buttons */
    button {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: rgba(255, 255, 255, 0.04); }
    button.primary {
      background: var(--accent);
      color: #0a0f1a;
      border-color: var(--accent);
      font-weight: 500;
    }
    button.primary:hover { background: #d4b57e; }
    button.danger {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }
    button.danger:hover { background: rgba(239, 68, 68, 0.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-group { display: flex; gap: 6px; }

    /* Profile edit form */
    .profile-card {
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .profile-card.running { border-color: #10b981; }
    .profile-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .profile-name {
      flex: 1;
      font-weight: 500;
      font-size: 13px;
    }
    .profile-server {
      color: var(--fg-muted);
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .edit-form {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 8px;
    }
    .edit-form.open { display: flex; }
    .form-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-row label {
      width: 72px;
      font-size: 11px;
      color: var(--fg-muted);
      flex-shrink: 0;
    }
    .form-row input[type="text"],
    .form-row input[type="password"],
    .form-row select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg);
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--border-strong); }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--fg-muted);
    }
    .form-row.inline {
      flex-wrap: wrap;
      gap: 12px;
    }
    .form-row.actions {
      justify-content: flex-end;
      margin-top: 4px;
      gap: 6px;
    }
    .empty {
      text-align: center;
      padding: 24px;
      color: var(--fg-muted);
      font-size: 12px;
    }
    .add-row {
      margin-top: 10px;
      text-align: center;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .toast.visible { opacity: 1; }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    /* Update banner — compact strip at bottom of Server tab */
    .update-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      margin-top: 10px;
      background: rgba(201, 169, 110, 0.06);
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 8px;
      font-size: 12px;
      color: var(--accent);
    }
    .update-banner button {
      font-size: 11px;
      padding: 3px 10px;
      color: var(--accent);
      border-color: rgba(201, 169, 110, 0.3);
    }
    .update-banner button:hover {
      background: rgba(201, 169, 110, 0.12);
    }

    /* Updates expanded panel */
    .updates-panel {
      margin-top: 6px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .updates-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    #updates-title {
      font-size: 12px;
      font-weight: 500;
    }
    #updates-title.success { color: #4ade80; }
    #updates-title.warn { color: var(--accent); }
    .version-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }
    .version-row + .version-row { border-top: 1px solid var(--border); }
    .version-row .name { flex: 1; color: var(--fg); }
    .version-row .vers {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--fg-muted);
      font-size: 11px;
    }
    .version-row .vers .new {
      color: var(--accent);
      font-weight: 500;
    }
    .version-row .vers .tag {
      color: var(--fg-muted);
      opacity: 0.6;
      margin-left: 4px;
      font-size: 10px;
    }
    .updates-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 8px;
    }
    .updates-actions button { font-size: 12px; padding: 4px 12px; }
    .update-progress { margin-top: 6px; }
    .update-row {
      font-size: 12px;
      padding: 3px 0;
      color: var(--fg-muted);
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .update-row.pending { color: var(--fg-muted); }
    .update-row.ok { color: #4ade80; }
    .update-row.fail { color: #f87171; }
    .update-row.info { color: var(--accent); }
    .update-row .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .update-row .elapsed {
      color: var(--fg-muted);
      opacity: 0.6;
      font-size: 11px;
      margin-left: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TTS progress (inside compact card) */
    .tts-progress {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--fg-muted);
    }

    /* Settings card */
    .settings-card .form-row {
      margin-bottom: 10px;
    }
    .settings-card .form-row label {
      width: 84px;
    }
    .settings-card .form-row input[type="text"],
    .settings-card .form-row select {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .settings-footer {
      margin-top: 10px;
      text-align: center;
    }
    .settings-footer button {
      font-size: 12px;
      padding: 5px 14px;
    }

    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1><img src="avatar.png" alt="" />Tianshu</h1>
  <div class="tagline">AI agent runtime — self-contained desktop launcher</div>

  <div class="tabs">
    <div class="tab active" data-tab="server">Server</div>
    <div class="tab" data-tab="bridge">
      Local Bridge
      <span class="tab-badge" id="bridge-badge">0</span>
    </div>
    <div class="tab" data-tab="settings">Settings</div>
  </div>

  <!-- Server tab -->
  <div id="tab-server" class="tab-panel active">
    <div class="card server-card">
      <div class="card-row">
        <div class="card-info">
          <div class="card-title">
            <span class="dot" id="server-dot"></span>
            Tianshu Server
          </div>
          <div class="card-sub" id="server-sub">Stopped</div>
        </div>
        <div class="btn-group">
          <button id="server-btn" class="primary">Start</button>
          <button id="open-ui-btn" disabled>Open &rarr;</button>
        </div>
      </div>
    </div>

    <!-- TTS compact card -->
    <div class="card" id="tts-card">
      <div class="card-row">
        <div class="card-info">
          <div class="card-title">
            <span class="dot" id="tts-dot"></span>
            TTS Server
          </div>
          <div class="card-sub" id="tts-sub">Checking&hellip;</div>
        </div>
        <div class="btn-group" id="tts-actions"></div>
      </div>
      <div id="tts-progress" class="tts-progress" style="display:none"></div>
    </div>

    <!-- Update banner (hidden until background check finds updates) -->
    <div id="update-banner" class="update-banner" style="display:none">
      <span id="update-banner-text"></span>
      <button id="update-banner-btn">Update</button>
    </div>

    <!-- Expanded update panel (shown when user clicks Update) -->
    <div id="updates-panel" class="updates-panel" style="display:none">
      <div class="updates-head">
        <span id="updates-title">Updates</span>
        <button id="close-updates-btn" style="font-size:11px;padding:3px 8px">Close</button>
      </div>
      <div id="updates-body"></div>
    </div>
  </div>

  <!-- Bridge tab -->
  <div id="tab-bridge" class="tab-panel">
    <div id="profile-list"></div>
    <div class="add-row">
      <button id="add-profile-btn">+ Add Profile</button>
      <button id="paste-profile-btn">&#x1F4CB; Paste from Clipboard</button>
    </div>
  </div>

  <!-- Settings tab -->
  <div id="tab-settings" class="tab-panel">
    <div class="card settings-card">
      <div class="form-row">
        <label>Channel</label>
        <select id="update-channel-select">
          <option value="stable">Stable (latest releases)</option>
          <option value="next">Next (pre-release)</option>
        </select>
      </div>
      <div class="form-row">
        <label>npm Registry</label>
        <input id="npm-registry-input" type="text" placeholder="https://registry.npmmirror.com">
      </div>
      <div class="form-row">
        <label>PyPI Index</label>
        <input id="pip-index-input" type="text" placeholder="https://pypi.tuna.tsinghua.edu.cn/simple">
      </div>
      <div class="form-row">
        <label>Python Mirror</label>
        <input id="python-mirror-input" type="text" placeholder="https://mirrors.aliyun.com/...">
      </div>
      <div class="form-row actions">
        <button id="save-settings-btn" class="primary">Save</button>
      </div>
    </div>
    <div class="settings-footer">
      <button id="check-updates-btn">Check for Updates</button>
    </div>
  </div>

  <div class="footer">
    Server: <code>~/.tianshu/</code> &middot; Bridge: <code>~/.tianshu-bridge/</code>
  </div>

  <div class="toast" id="toast"></div>

  <script src="main.js"></script>
</body>
</html>
